name: Android Release & GitHub Distribution

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create release as draft'
        type: boolean
        required: false
        default: false
      prerelease:
        description: 'Mark release as pre-release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: "android-release-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Verify Node.js version
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Extract version information
        id: version_info
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_NAME="${{ github.ref_name }}"
            VERSION="${TAG_NAME#v}"
          else
            VERSION=$(node -p "require('./package.json').version")
            TAG_NAME="v${VERSION}"
          fi
          # Calculate numeric versionCode from major.minor.patch (e.g. 1.1.0 -> 10100)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          VERSION_CODE=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
          if [ "$VERSION_CODE" -le 0 ]; then
            VERSION_CODE=1
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "Building FinTracker version ${VERSION} (tag: ${TAG_NAME}, versionCode: ${VERSION_CODE})"

      - name: Build web application
        run: npm run build
        env:
          VITE_BASE_PATH: './'

      - name: Synchronize web build with Android
        run: npx cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify Android SDK
        run: |
          sdkmanager --list | head -n 40
          adb version
          ls -la "$ANDROID_SDK_ROOT/platforms/android-36"
          ls -la "$ANDROID_SDK_ROOT/build-tools/36.0.0"

      - name: Validate production signing secrets
        id: keystore_prep
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          MISSING_SECRETS=""
          if [ -z "$KEYSTORE_BASE64" ]; then MISSING_SECRETS="$MISSING_SECRETS ANDROID_KEYSTORE_BASE64"; fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then MISSING_SECRETS="$MISSING_SECRETS ANDROID_KEYSTORE_PASSWORD"; fi
          if [ -z "$KEY_ALIAS" ]; then MISSING_SECRETS="$MISSING_SECRETS ANDROID_KEY_ALIAS"; fi
          if [ -z "$KEY_PASSWORD" ]; then MISSING_SECRETS="$MISSING_SECRETS ANDROID_KEY_PASSWORD"; fi

          if [ -n "$MISSING_SECRETS" ]; then
            echo "::error ::Missing mandatory production release signing secrets:$MISSING_SECRETS"
            echo "Production release builds must be signed with the official FinTracker key. Refusing to publish an unsigned APK."
            exit 1
          fi

          echo "All signing secrets present. Decoding release keystore..."
          KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          echo "keystore_path=$KEYSTORE_FILE" >> $GITHUB_OUTPUT

      - name: Build Android Release APK
        working-directory: android
        env:
          APP_VERSION: ${{ steps.version_info.outputs.version }}
          APP_VERSION_CODE: ${{ steps.version_info.outputs.version_code }}
          KEYSTORE_FILE: ${{ steps.keystore_prep.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify and package release artifacts
        id: package_artifacts
        run: |
          RELEASE_DIR="android/app/build/outputs/apk/release"
          # Look specifically for the signed production APK (exclude any -unsigned or -debug files)
          APK_FILE=$(find "$RELEASE_DIR" -name "FinTracker-v*.apk" ! -name "*-unsigned.apk" ! -name "*-debug.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "::error ::Signed production release APK not found in $RELEASE_DIR. Build produced no signed artifact."
            exit 1
          fi

          # Verify signature using apksigner
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          if [ -f "$APKSIGNER" ]; then
            echo "Verifying APK signature with apksigner..."
            "$APKSIGNER" verify --verbose "$APK_FILE"
          fi

          APK_BASENAME=$(basename "$APK_FILE")
          echo "Found verified signed release artifact: $APK_FILE ($APK_BASENAME)"

          # Compute SHA-256 checksum strictly on the signed production APK
          cd "$RELEASE_DIR"
          sha256sum "$APK_BASENAME" > "${APK_BASENAME}.sha256"
          cd - > /dev/null

          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT
          echo "sha256_path=${APK_FILE}.sha256" >> $GITHUB_OUTPUT
          echo "apk_filename=$APK_BASENAME" >> $GITHUB_OUTPUT
          ls -lh "$APK_FILE" "${APK_FILE}.sha256"

      - name: Generate release notes
        id: release_notes
        run: |
          cat << 'EOF' > release_notes.md
          ## 💎 FinTracker for Android — ${{ steps.version_info.outputs.tag_name }}

          ### 📦 Download & Installation
          Download and install the APK below on your Android device:
          * **Artifact**: `${{ steps.package_artifacts.outputs.apk_filename }}`
          * **Package ID**: `com.fintracker.app`
          * **Integrity (SHA-256)**: See attached `${{ steps.package_artifacts.outputs.apk_filename }}.sha256`

          ### 🛡️ Privacy & Local-First Architecture
          * **Zero Cloud Dependencies**: 100% offline-first local IndexedDB storage.
          * **Data Preservation**: Upgrades preserve all existing financial records, transactions, and categories intact.
          * **Zero Sensitive Permissions**: Only standard internet connectivity for in-app release updates. Zero SMS reading, zero notification access.

          ---
          *Official FinTracker Release distribution.*
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.version_info.outputs.tag_name }}
          name: FinTracker ${{ steps.version_info.outputs.tag_name }}
          body_path: release_notes.md
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          files: |
            ${{ steps.package_artifacts.outputs.apk_path }}
            ${{ steps.package_artifacts.outputs.sha256_path }}
